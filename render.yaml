# ==============================================================================
# Render Blueprint — EasyEat
# Defines two services:
#   - easyeat-backend  → Docker Web Service (Spring Boot, port 8080)
#   - easyeat-frontend → Static Site (Vite/React, served from dist/)
#
# AFTER first deploy, set the following env vars manually in the Render dashboard
# (marked with sync: false below):
#   SPRING_DATASOURCE_PASSWORD, JWT_SECRET, SPRING_MAIL_USERNAME,
#   SPRING_MAIL_PASSWORD, APP_MAIL_FROM, APP_CORS_ALLOWED_ORIGINS,
#   APP_PASSWORD_RESET_BASE_URL, APP_EMAIL_VERIFICATION_BASE_URL,
#   VITE_API_BASE_URL
# ==============================================================================

services:

  # ── Backend ─────────────────────────────────────────────────────────────────
  - type: web
    name: easyeat-backend
    runtime: docker
    plan: free
    dockerfilePath: ./easyeat/backend/Dockerfile
    dockerContext: ./easyeat/backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Neon PostgreSQL — URL is not sensitive; password is set separately.
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://ep-curly-pine-b6mdts0p-pooler.c-2.sa-east-1.aws.neon.tech/neondb?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: neondb_owner
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false   # Set manually in the Render dashboard

      # JWT — generate a strong 64-char random secret for production.
      - key: JWT_SECRET
        sync: false   # Set manually in the Render dashboard

      # Gmail SMTP — use an App Password (not the account password).
      - key: SPRING_MAIL_USERNAME
        sync: false   # Set manually: your_account@gmail.com
      - key: SPRING_MAIL_PASSWORD
        sync: false   # Set manually: 16-character App Password (no spaces)
      - key: APP_MAIL_FROM
        sync: false   # Set manually: same as SPRING_MAIL_USERNAME

      # CORS — set after the frontend is deployed and you know its URL.
      # Example: https://easyeat-frontend.onrender.com
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false   # Set manually after frontend is live

      # Frontend URLs embedded in emails — set after frontend is deployed.
      - key: APP_PASSWORD_RESET_BASE_URL
        sync: false   # Example: https://easyeat-frontend.onrender.com/reset-password
      - key: APP_EMAIL_VERIFICATION_BASE_URL
        sync: false   # Example: https://easyeat-frontend.onrender.com/verificar-email

  # ── Frontend ─────────────────────────────────────────────────────────────────
  - type: static
    name: easyeat-frontend
    rootDir: easyeat/frontend
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      # Set to the backend Render URL before the first deploy.
      # Example: https://easyeat-backend.onrender.com/api/v1
      - key: VITE_API_BASE_URL
        sync: false   # Set manually in the Render dashboard
    routes:
      # Required for React Router: all paths fall back to index.html.
      - type: rewrite
        source: /*
        destination: /index.html
