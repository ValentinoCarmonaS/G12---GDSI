server {
    listen ${PORT};
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para optimizar transferencia de texto
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Regla 1: Activos estáticos con hash inmutable generados por Vite (Q5, Inv-SPA-03)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Regla 2: Enrutamiento SPA con try_files y revalidación de index.html (AS-18, FR-019, Q5, Inv-SPA-01, Inv-SPA-02)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Página de error por omisión ante fallos internos
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
