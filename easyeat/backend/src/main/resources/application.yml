server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: "10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|169\\.254\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}"

spring:
  application:
    name: easyeat-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/easyeat}
    username: ${SPRING_DATASOURCE_USERNAME:easyeat}
    password: ${SPRING_DATASOURCE_PASSWORD:easyeat_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      validation-timeout: 5000
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    problemdetails:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mail:
    # spring.mail.host se omite intencionalmente por defecto para que JavaMailSender solo se active
    # cuando SPRING_MAIL_HOST este definido en el entorno (evita bloqueos SMTP en Render Free).
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt:
      secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      expiration-ms: 28800000 # 8 hours (28800 seconds)
    bcrypt:
      cost: 12
    rate-limiting:
      login:
        max-attempts: 5
        duration-minutes: 15
      reset:
        max-attempts: 1
        duration-seconds: 60
    password-reset:
      token-validity-minutes: 15
      base-url: ${APP_PASSWORD_RESET_BASE_URL:http://localhost:3000/reset-password}
    email-verification:
      token-validity-hours: 24
      cooldown-seconds: 60
      base-url: ${APP_EMAIL_VERIFICATION_BASE_URL:http://localhost:3000/verificar-email}
    mail:
      from: ${APP_MAIL_FROM:${spring.mail.username:noreply@easyeat.com}}

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
  public-key: ${MERCADOPAGO_PUBLIC_KEY:}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
  sandbox: ${MERCADOPAGO_SANDBOX:true}
  base-url: ${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
  frontend-base-url: ${MERCADOPAGO_FRONTEND_BASE_URL:http://localhost:3000}
  backend-base-url: ${MERCADOPAGO_BACKEND_BASE_URL:${RENDER_EXTERNAL_URL:}}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

