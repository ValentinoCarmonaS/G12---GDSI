server:
  port: 8080
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: "10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|169\\.254\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}"

spring:
  application:
    name: easyeat-backend
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      expiration-ms: 28800000 # 8 hours (28800 seconds)
    bcrypt:
      cost: 12
    rate-limiting:
      login:
        max-attempts: 5
        duration-minutes: 15
      reset:
        max-attempts: 1
        duration-seconds: 60
    password-reset:
      token-validity-minutes: 15
      base-url: ${APP_PASSWORD_RESET_BASE_URL:http://localhost:3000/reset-password}
