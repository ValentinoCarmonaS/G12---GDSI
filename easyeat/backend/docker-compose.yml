version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: easyeat-postgres
    environment:
      POSTGRES_DB: easyeat
      POSTGRES_USER: easyeat
      POSTGRES_PASSWORD: easyeat_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyeat -d easyeat"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: easyeat-mailpit
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port
    restart: unless-stopped

volumes:
  postgres_data:
