name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Lint, Tests & Verify (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Run Backend Tests & Package (mvn verify)
        working-directory: easyeat/backend
        run: mvn -B clean verify

  frontend-checks:
    name: Frontend Lint & Build (React)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check if Frontend is Scaffolded
        id: check_frontend
        run: |
          if [ -f "easyeat/frontend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Frontend not yet scaffolded in this branch; skipping checks."
          fi

      - name: Set up Node.js 20
        if: steps.check_frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: easyeat/frontend/package-lock.json

      - name: Install Frontend Dependencies
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: easyeat/frontend
        run: npm ci

      - name: Run Frontend Linter
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: easyeat/frontend
        run: npm run lint --if-present

      - name: Run Frontend Tests
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: easyeat/frontend
        run: npm test --if-present

      - name: Verify Production Build
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: easyeat/frontend
        run: npm run build
