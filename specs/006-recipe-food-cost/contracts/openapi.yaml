openapi: 3.0.3
info:
  title: EasyEat - Recipe Management and Food Cost Audit API
  version: 1.0.0
  description: API contracts for dish recipe persistence (Many-to-Many) and automated food cost auditing with declared dietary labels (Sprint 2 - ADM-5.1.2, CHF-2.2.2 Backend, aligned with Spec 005).
servers:
  - url: /api/v1
    description: Production & Local Gateway

paths:
  /dishes/{id}/recipe:
    put:
      tags:
        - Chef Dishes
      summary: Upsert full dish recipe ingredient list (CHF-2.2.2 Backend)
      description: |
        Replaces or updates recipe ingredient lines atomically using normalized 3NF.
        Every ingredient must exist, belong to establishment, and be in ACTIVE status.
        Quantities must be strictly greater than zero (> 0).
        Blocked if dish status is PENDING_PRICE or published.
      operationId: updateDishRecipe
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the dish
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeUpdateRequest'
      responses:
        '200':
          description: Recipe updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeResponse'
        '400':
          description: Validation error or duplicate ingredient
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden (cross-tenant access)
        '404':
          description: Dish or ingredient not found
        '409':
          description: Recipe editing blocked because dish status is PENDING_PRICE or published
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Inactive/Discontinued ingredient referenced
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /dishes/{id}/cost-audit:
    get:
      tags:
        - Admin Dish Cost Audit
      summary: Retrieve dynamic Food Cost audit and declared dietary labels (ADM-5.1.2)
      description: |
        Computes real-time raw material production cost per portion and reads declared dietary restriction tags.
        Restricted exclusively to ADMINISTRADOR role.
        Dish must be in PENDING_PRICE status (submitted for review by the Chef).
      operationId: auditDishCost
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the dish
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Itemized Food Cost audit and dietary labels breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodCostAuditResponse'
        '400':
          description: Dish has no assigned recipe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden (access restricted strictly to ADMINISTRADOR)
        '404':
          description: Dish not found
        '409':
          description: Dish is not in PENDING_PRICE status (e.g. still in DRAFT)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UnitOfMeasure:
      type: string
      enum: [G, KG, ML, L, U]
      example: G

    RecipeIngredientInput:
      type: object
      required:
        - ingredientId
        - quantity
      properties:
        ingredientId:
          type: string
          format: uuid
          example: 7d6c6e12-4f32-47d3-9f56-2e86bf30fa12
        quantity:
          type: number
          format: decimal
          minimum: 0.0001
          example: 250.0

    RecipeUpdateRequest:
      type: object
      required:
        - ingredients
      properties:
        ingredients:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RecipeIngredientInput'

    RecipeIngredientItem:
      type: object
      required:
        - ingredientId
        - ingredientName
        - quantity
        - unitOfMeasure
      properties:
        ingredientId:
          type: string
          format: uuid
        ingredientName:
          type: string
          example: Harina 000
        quantity:
          type: number
          format: decimal
          example: 250.0
        unitOfMeasure:
          $ref: '#/components/schemas/UnitOfMeasure'

    RecipeResponse:
      type: object
      required:
        - dishId
        - ingredients
      properties:
        dishId:
          type: string
          format: uuid
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/RecipeIngredientItem'

    RecipeItemAuditResponse:
      type: object
      required:
        - ingredientId
        - ingredientName
        - recipeQuantity
        - unitOfMeasure
        - unitPurchaseCost
        - lineSubtotal
        - unpricedWarning
      properties:
        ingredientId:
          type: string
          format: uuid
        ingredientName:
          type: string
          example: Tomate Perita
        recipeQuantity:
          type: number
          format: decimal
          example: 150.0
        unitOfMeasure:
          $ref: '#/components/schemas/UnitOfMeasure'
        unitPurchaseCost:
          type: number
          format: decimal
          example: 1200.00
        lineSubtotal:
          type: number
          format: decimal
          example: 180.00
        unpricedWarning:
          type: boolean
          example: false

    FoodCostAuditResponse:
      type: object
      required:
        - dishId
        - dishName
        - totalFoodCost
        - hasUnpricedIngredients
        - warningNotes
        - requiredDietaryRestrictions
        - items
      properties:
        dishId:
          type: string
          format: uuid
        dishName:
          type: string
          example: Pizza Margherita
        totalFoodCost:
          type: number
          format: decimal
          example: 850.50
        hasUnpricedIngredients:
          type: boolean
          example: false
        warningNotes:
          type: array
          items:
            type: string
          example: []
        requiredDietaryRestrictions:
          type: array
          items:
            type: string
          example: ["CELIAC", "DAIRY"]
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecipeItemAuditResponse'

    ProblemDetail:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          example: https://api.easyeat.com/errors/invalid-state
        title:
          type: string
          example: Invalid Dish State
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: Dish must be in PENDING_PRICE status to perform cost audit.
        instance:
          type: string
          example: /api/v1/dishes/7d6c6e12-4f32-47d3-9f56-2e86bf30fa12/cost-audit
