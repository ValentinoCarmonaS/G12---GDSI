openapi: 3.0.3
info:
  title: EasyEat - Chef Dish Management API (Technical File & Submission)
  version: 1.0.0
  description: |
    OpenAPI 3.0 contract for the Chef Dish Management module in EasyEat (spec 005).
    Covers technical file creation (CHF-2.2.1), recipe bill-of-materials definition (CHF-2.2.2),
    allergen & dietary labeling (CHF-2.2.3), and submission for administrator review (CHF-2.2.4).
servers:
  - url: /api/v1
    description: EasyEat REST API v1
tags:
  - name: Chef Dishes
    description: Lifecycle and technical file management for restaurant chefs

paths:
  /dishes:
    post:
      tags:
        - Chef Dishes
      summary: Create new dish technical file draft (CHF-2.2.1)
      description: |
        Creates a new dish draft belonging to the authenticated Chef's establishment.
        Assigns initial status DRAFT. Dish name must be unique within tenant after trimming.
      operationId: createDishDraft
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDishRequest'
      responses:
        '201':
          description: Dish draft created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DishDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Dish name already exists within the establishment (trimmed case-insensitive)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    get:
      tags:
        - Chef Dishes
      summary: List establishment dish drafts and files (CHF-2.2.1, CHF-2.2.4)
      description: |
        Returns paginated list of dishes belonging to the Chef's establishment.
        Default ordering is updated_at descending.
      operationId: listDishes
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by dish status. If omitted or ALL, returns all establishment dishes.
          schema:
            type: string
            enum: [ALL, DRAFT, PENDING_PRICE]
            default: ALL
        - name: page
          in: query
          required: false
          description: Page number (0-based)
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Number of records per page (default 20)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated dish list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DishPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /dishes/{id}:
    get:
      tags:
        - Chef Dishes
      summary: Fetch complete dish technical file (CHF-2.2.1, CHF-2.2.2, CHF-2.2.3)
      description: Returns full technical file details including basic identity, photo reference, recipe ingredients, and allergen confirmation.
      operationId: getDishById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the dish
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Complete technical file details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DishDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Chef Dishes
      summary: Update dish basic identity (CHF-2.2.1)
      description: Updates dish name, category, and description. Blocked if dish is not in DRAFT status.
      operationId: updateDishBasicInfo
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDishRequest'
      responses:
        '200':
          description: Basic information updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DishDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Name collision or modification blocked because dish status is PENDING_PRICE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    delete:
      tags:
        - Chef Dishes
      summary: Permanently delete dish draft (CHF-2.2.1)
      description: Deletes the draft and cascades removal of recipe lines and allergen mappings. Blocked if status is PENDING_PRICE.
      operationId: deleteDishDraft
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Draft permanently removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Dish deletion rejected because status is PENDING_PRICE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /dishes/{id}/photo:
    post:
      tags:
        - Chef Dishes
      summary: Upload or replace dish photo (CHF-2.2.1)
      description: |
        Uploads an image (JPEG, PNG, WebP; max 5 MB). Persists binary in database.
        Blocked if status is PENDING_PRICE.
      operationId: uploadDishPhoto
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (JPEG, PNG, or WebP; maximum 5 MB)
      responses:
        '200':
          description: Photo uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoUploadResponse'
        '400':
          description: Invalid image format or file exceeds 5 MB limit
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Photo upload blocked because dish status is PENDING_PRICE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    get:
      tags:
        - Chef Dishes
      summary: Retrieve dish photo binary (CHF-2.2.1)
      description: Returns raw binary image bytes with appropriate image MIME type and cache headers.
      operationId: getDishPhoto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Binary photo retrieved successfully
          headers:
            Content-Type:
              schema:
                type: string
                example: image/jpeg
            Cache-Control:
              schema:
                type: string
                example: private, max-age=86400
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Chef Dishes
      summary: Remove photo from draft (CHF-2.2.1)
      description: Deletes associated photo from dish. Blocked if status is PENDING_PRICE.
      operationId: deleteDishPhoto
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Photo removed successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Photo deletion blocked because dish status is PENDING_PRICE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /dishes/{id}/recipe:
    put:
      tags:
        - Chef Dishes
      summary: Upsert full dish recipe ingredient list (CHF-2.2.2)
      description: |
        Replaces or updates recipe ingredient lines.
        Every ingredient must exist, belong to establishment, and be in ACTIVE status.
        Quantities must be strictly greater than zero (> 0).
        Discrete units ('u') require integer quantities; continuous units accept decimals.
        Blocked if status is PENDING_PRICE.
      operationId: updateDishRecipe
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeUpdateRequest'
      responses:
        '200':
          description: Recipe updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Ingredient duplicate or recipe editing blocked because dish status is PENDING_PRICE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Inactive ingredient referenced or quantity rule violation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /dishes/{id}/recipe/ingredients/{ingredientId}:
    delete:
      tags:
        - Chef Dishes
      summary: Remove ingredient line from recipe (CHF-2.2.2)
      description: Removes single ingredient line. Blocked if status is PENDING_PRICE.
      operationId: removeRecipeIngredient
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: ingredientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Ingredient removed from recipe
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Modification blocked because dish status is PENDING_PRICE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /dishes/{id}/allergens:
    put:
      tags:
        - Chef Dishes
      summary: Update dietary restrictions and confirm allergen section (CHF-2.2.3)
      description: |
        Persists dietary lifestyle tags (VEGAN, VEGETARIAN, CELIAC) and common allergen tags.
        Can explicitly mark section as confirmed (allergensConfirmed = true).
        Blocked if status is PENDING_PRICE.
      operationId: updateDishAllergens
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllergenUpdateRequest'
      responses:
        '200':
          description: Allergens and confirmation state updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllergenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Modification blocked because dish status is PENDING_PRICE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /dishes/{id}/submit-review:
    post:
      tags:
        - Chef Dishes
      summary: Evaluate completeness gate and submit dish to review (CHF-2.2.4)
      description: |
        Evaluates the 4 completeness conditions:
        1. Name and category present.
        2. Recipe contains >= 1 ingredient with positive quantity.
        3. All recipe ingredients are currently ACTIVE in inventory.
        4. Allergen section is explicitly confirmed (allergens_confirmed = true).
        If all pass, transitions dish to PENDING_PRICE, locks it, and generates admin alert.
      operationId: submitDishForReview
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dish successfully transitioned to PENDING_PRICE and submitted for review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DishDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Dish is already in PENDING_PRICE status
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Completeness gate failure listing all unmet conditions
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DishCategory:
      type: string
      enum:
        - Entradas
        - Platos principales
        - Postres
        - Bebidas
        - Ensaladas

    DishStatus:
      type: string
      enum:
        - DRAFT
        - PENDING_PRICE

    CreateDishRequest:
      type: object
      required:
        - name
        - category
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: "Risotto de Hongos Portobello"
        category:
          $ref: '#/components/schemas/DishCategory'
        description:
          type: string
          maxLength: 500
          nullable: true
          example: "Arroz carnaroli cocido lentamente con caldo de verduras, hongos frescos y queso parmesano."

    UpdateDishRequest:
      type: object
      required:
        - name
        - category
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: "Risotto de Hongos Silvestres"
        category:
          $ref: '#/components/schemas/DishCategory'
        description:
          type: string
          maxLength: 500
          nullable: true
          example: "Arroz carnaroli con seleccion de hongos silvestres y manteca artesanal."

    RecipeIngredientItem:
      type: object
      required:
        - ingredientId
        - quantity
      properties:
        ingredientId:
          type: string
          format: uuid
          example: "c1eebc99-9c0b-4ef8-bb6d-6bb9bd380a01"
        ingredientName:
          type: string
          readOnly: true
          example: "Arroz Carnaroli"
        quantity:
          type: number
          format: double
          minimum: 0.0001
          example: 150.0
        unitOfMeasure:
          type: string
          readOnly: true
          example: "g"
        isIngredientActive:
          type: boolean
          readOnly: true
          example: true

    RecipeUpdateRequest:
      type: object
      required:
        - ingredients
      properties:
        ingredients:
          type: array
          items:
            type: object
            required:
              - ingredientId
              - quantity
            properties:
              ingredientId:
                type: string
                format: uuid
              quantity:
                type: number
                minimum: 0.0001
                example: 150.0

    RecipeResponse:
      type: object
      properties:
        dishId:
          type: string
          format: uuid
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/RecipeIngredientItem'

    AllergenUpdateRequest:
      type: object
      required:
        - restrictionCodes
        - confirmed
      properties:
        restrictionCodes:
          type: array
          items:
            type: string
          example: ["CELIAC", "DAIRY"]
        confirmed:
          type: boolean
          example: true

    AllergenResponse:
      type: object
      properties:
        dishId:
          type: string
          format: uuid
        restrictionCodes:
          type: array
          items:
            type: string
        allergensConfirmed:
          type: boolean

    DishSummaryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        category:
          $ref: '#/components/schemas/DishCategory'
        description:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/DishStatus'
        allergensConfirmed:
          type: boolean
        recipeIngredientCount:
          type: integer
        isCompleteForReview:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    DishDetailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        category:
          $ref: '#/components/schemas/DishCategory'
        description:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/DishStatus'
        allergensConfirmed:
          type: boolean
        restrictionCodes:
          type: array
          items:
            type: string
        recipe:
          type: array
          items:
            $ref: '#/components/schemas/RecipeIngredientItem'
        isCompleteForReview:
          type: boolean
        missingConditions:
          type: array
          items:
            type: string
        createdById:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DishPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/DishSummaryResponse'
        pageNumber:
          type: integer
          example: 0
        pageSize:
          type: integer
          example: 20
        totalElements:
          type: integer
          example: 35
        totalPages:
          type: integer
          example: 2
        isLast:
          type: boolean
          example: false

    PhotoUploadResponse:
      type: object
      properties:
        dishId:
          type: string
          format: uuid
        fileName:
          type: string
        contentType:
          type: string
        fileSize:
          type: integer
        photoUrl:
          type: string
          example: "/api/v1/dishes/d1eebc99-9c0b-4ef8-bb6d-6bb9bd380a01/photo"

    ProblemDetail:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          example: "https://easyeat.com/errors/validation-failed"
        title:
          type: string
          example: "Unprocessable Entity"
        status:
          type: integer
          example: 422
        detail:
          type: string
          example: "Dish draft does not meet submission completeness conditions."
        instance:
          type: string
          example: "/api/v1/dishes/d1eebc99-9c0b-4ef8-bb6d-6bb9bd380a01/submit-review"
        invalidParams:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              reason:
                type: string

  responses:
    BadRequest:
      description: Invalid request syntax, missing required fields, or validation failure (RFC 7807/9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Missing, invalid, or expired JWT token (RFC 7807/9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Access denied due to insufficient role permissions (RFC 7807/9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Requested entity was not found (RFC 7807/9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
